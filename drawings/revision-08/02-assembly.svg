<svg xmlns="http://www.w3.org/2000/svg" width="1190.5511811023623" height="841.8897637795277" viewBox="0 0 1190.5511811023623 841.8897637795277"><rect width="100%" height="100%" fill="white"/><line x1="22" y1="22" x2="1168.5511811023623" y2="22" stroke="#657789" stroke-width="0.65"/><line x1="1168.5511811023623" y1="22" x2="1168.5511811023623" y2="819.8897637795277" stroke="#657789" stroke-width="0.65"/><line x1="1168.5511811023623" y1="819.8897637795277" x2="22" y2="819.8897637795277" stroke="#657789" stroke-width="0.65"/><line x1="22" y1="819.8897637795277" x2="22" y2="22" stroke="#657789" stroke-width="0.65"/><text x="38" y="48" font-family="Arial" font-size="17" font-weight="700" fill="#21354a">02 · Послідовність складання й контроль</text><text x="38" y="69" font-family="Arial" font-size="9" font-weight="400" fill="#21354a">Спочатку перевірка деталей, потім каркас і внутрішні вузли, після цього обшивка.</text><line x1="22" y1="757.8897637795277" x2="1168.5511811023623" y2="757.8897637795277" stroke="#657789" stroke-width="0.65"/><line x1="1168.5511811023623" y1="757.8897637795277" x2="1168.5511811023623" y2="819.8897637795277" stroke="#657789" stroke-width="0.65"/><line x1="1168.5511811023623" y1="819.8897637795277" x2="22" y2="819.8897637795277" stroke="#657789" stroke-width="0.65"/><line x1="22" y1="819.8897637795277" x2="22" y2="757.8897637795277" stroke="#657789" stroke-width="0.65"/><line x1="845.5511811023623" y1="757.8897637795277" x2="845.5511811023623" y2="819.8897637795277" stroke="#354657" stroke-width="0.65"/><text x="38" y="779.8897637795277" font-family="Arial" font-size="12" font-weight="700" fill="#21354a">ФОТОБУДКА · СЛАВУТИЧ</text><text x="38" y="798.8897637795277" font-family="Arial" font-size="9" font-weight="400" fill="#21354a">Ревізія 08 · 16.09.2026 · розміри в мм · не масштабувати з екрана</text><text x="860.5511811023623" y="779.8897637795277" font-family="Arial" font-size="12" font-weight="700" fill="#21354a">A-02</text><text x="860.5511811023623" y="798.8897637795277" font-family="Arial" font-size="9" font-weight="400" fill="#21354a">Перевірка перед виготовленням</text><text x="50" y="120" font-family="Arial" font-size="12" font-weight="700" fill="#21354a">1. Звірити авторські панелі</text><text x="65" y="144" font-family="Arial" font-size="9" font-weight="400" fill="#21354a">Звірити Dimensions із відомістю. Дверцята 8,87 мм та похилі плити перевірити до замовлення матеріалу.</text><text x="50" y="192" font-family="Arial" font-size="12" font-weight="700" fill="#21354a">2. Зібрати нижню раму й стійки</text><text x="65" y="216" font-family="Arial" font-size="9" font-weight="400" fill="#21354a">Виставити прямокутність, однакові діагоналі та вертикальність. Присадка силових вузлів потребує узгодження.</text><text x="50" y="264" font-family="Arial" font-size="12" font-weight="700" fill="#21354a">3. Приміряти полиці з реальним обладнанням</text><text x="65" y="288" font-family="Arial" font-size="9" font-weight="400" fill="#21354a">Перевірити завантаження паперу, відкриття кришок, виймання принтерів і простір для кабельних роз’ємів.</text><text x="50" y="336" font-family="Arial" font-size="12" font-weight="700" fill="#21354a">4. Встановити ліфт і вертикальну камеру</text><text x="65" y="360" font-family="Arial" font-size="9" font-weight="400" fill="#21354a">Перевірити весь хід без контакту з панелями. Переднє скло та адаптери не повинні торкатися каркаса.</text><text x="50" y="408" font-family="Arial" font-size="12" font-weight="700" fill="#21354a">5. Обшивка й сервісні дверцята</text><text x="65" y="432" font-family="Arial" font-size="9" font-weight="400" fill="#21354a">Не дублювати боковини модуля. Петлі й замок розмітити за паспортом фактично придбаної фурнітури.</text><text x="50" y="480" font-family="Arial" font-size="12" font-weight="700" fill="#21354a">6. Опалові панелі й захисне вікно</text><text x="65" y="504" font-family="Arial" font-size="9" font-weight="400" fill="#21354a">Притиск через пружні прокладки. Не свердлити оптичне скло. Передбачити знімання для обслуговування.</text><text x="50" y="552" font-family="Arial" font-size="12" font-weight="700" fill="#21354a">7. Лавка, м’яке сидіння, шторка</text><text x="65" y="576" font-family="Arial" font-size="9" font-weight="400" fill="#21354a">Перевірити опирання сидіння, доступ до речей і ширину проходу. Випробувати посадку та дотягування до екрана.</text><text x="50" y="624" font-family="Arial" font-size="12" font-weight="700" fill="#21354a">8. Приймання до запуску</text><text x="65" y="648" font-family="Arial" font-size="9" font-weight="400" fill="#21354a">Перевірити силові з’єднання, електрозахист, вентиляцію, повний хід ліфта, світло та всі тракти друку.</text></svg>