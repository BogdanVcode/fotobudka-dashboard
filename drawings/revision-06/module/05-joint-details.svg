<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050"><style>
 text{font-family:Arial,sans-serif;fill:#17212b}.title{font-size:28px;font-weight:700}.sub{font-size:15px}.viewTitle{font-size:18px;font-weight:700}.envelope{fill:#fbfcfd;stroke:#26343d;stroke-width:1.5}.rail{fill:#d9ecf7;stroke:#145d88;stroke-width:2}.heavy{fill:#78b9da;stroke-width:3}.slide{fill:#7d858a;stroke:#343b3f;stroke-width:1.5}.wood{fill:#ead9b8;fill-opacity:.52;stroke:#8a682d;stroke-width:1.6}.slope{fill:#dff0df;stroke:#39794b;stroke-width:2}.shelf{fill:#eee6cf;stroke:#8b6c20;stroke-width:1.5}.equipment{fill:#efb875;fill-opacity:.45;stroke:#9c5918;stroke-width:1.4}.mark{font-size:11px;font-weight:700}.dim{stroke:#3d5968;stroke-width:1;fill:none}.guide{stroke:#83949d;stroke-width:1;stroke-dasharray:4 4}.dimText{font-size:13px}.note{font-size:14px}.callout{fill:white;stroke:#657984}.joint{fill:#d9ecf7;stroke:#145d88;stroke-width:3}.bracket{fill:#d1a52c;stroke:#71570c;stroke-width:2}
 </style><rect width="1600" height="1050" fill="white"/><text class="title" x="28" y="38">Кутники, болти й гайки для старого каркаса</text><text class="sub" x="28" y="64">K1 використовується у звичайних вузлах; K2 — тільки на навантажених кінцях балок полиць.</text><rect class="callout" x="40" y="90" width="720" height="420" rx="8"/><text class="viewTitle" x="64" y="124">K1 · звичайний вузол: комплект 2028</text><rect class="joint" x="110" y="190" width="360" height="40"/><rect class="joint" x="430" y="150" width="40" height="220"/><path class="bracket" d="M402 230H430V258H402Z"/><circle cx="414" cy="244" r="5" fill="#52626b"/><circle cx="444" cy="244" r="5" fill="#52626b"/><text class="note" x="110" y="410">1 кутник 20×28 + 2 болти M5×12 + 2 T-гайки.</text><text class="note" x="110" y="438">44 робочі вузли + 4 запасні = 48 комплектів.</text><text class="note" x="110" y="466">Для стійок, поперечок, касети й сервісної рами.</text><rect class="callout" x="830" y="90" width="720" height="420" rx="8"/><text class="viewTitle" x="854" y="124">K2 · навантажений вузол полиці: комплект 2040</text><rect class="joint heavy" x="900" y="190" width="360" height="55"/><rect class="joint" x="1225" y="150" width="40" height="230"/><path class="bracket" d="M1185 245H1225V285H1185Z"/><text class="note" x="900" y="410">1 кутник 20×40 + 4 болти M5×12 + 4 T-гайки.</text><text class="note" x="900" y="438">8 кінців чотирьох балок + 2 запасні = 10 комплектів.</text><text class="note" x="900" y="466">2040 не ставиться у всі вузли каркаса.</text><rect class="callout" x="40" y="550" width="720" height="420" rx="8"/><text class="viewTitle" x="64" y="584">J3 · екран за похилою панеллю P01</text><path class="slope" d="M120 840L520 670L532 699L132 869Z"/><rect class="wood" x="265" y="700" width="210" height="150"/><rect class="bracket" x="315" y="730" width="110" height="90"/><text class="note" x="110" y="930">За вирізом P01 — рамка з фанери 18 мм.</text><text class="note" x="110" y="958">До неї болтами M6 кріпиться VESA 100/200.</text><text class="note" x="110" y="986">P01 кріпиться до наявних стійок старого каркаса.</text><rect class="callout" x="830" y="550" width="720" height="420" rx="8"/><text class="viewTitle" x="854" y="584">J4 · верхній матовий акрил P02</text><path class="wood" d="M900 855L1240 670L1254 696L914 881Z"/><path class="slope" d="M918 835L1232 665L1243 685L929 855Z"/><rect class="bracket" x="900" y="846" width="70" height="18"/><rect class="bracket" x="1195" y="680" width="70" height="18"/><text class="note" x="900" y="930">Акрил лежить на двох фанерних ребрах через EPDM.</text><text class="note" x="900" y="958">Нижній U-профіль постійний; верхній — знімний.</text><text class="note" x="900" y="986">Рамок між світловими панелями немає.</text></svg>