<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000"><style>text{font:17px Arial;fill:#17212b}.title{font:bold 23px Arial}.dim{stroke:#456575;stroke-width:1;fill:none}.part{fill:#f5f7fa;stroke:#17212b;stroke-width:2}.hole{fill:white;stroke:#b0473f;stroke-width:2}</style><rect width="1200" height="1000" fill="white"/><text x="35" y="40" class="title">R6-059 · Опора сухого піддона на основу</text><text x="35" y="75">20 × 25 × 20 мм · площина Y / Z · усі розміри в мм</text><text x="35" y="103">Початок деталі X / Y / Z = 383 / 840 / 80</text><rect class="part" x="120" y="150" width="440" height="550"/><path class="dim" d="M120 710 V750 M560 710 V750 M120 738 H560"/><text x="340" y="735" text-anchor="middle">20</text><path class="dim" d="M105 700 H65 M105 150 H65 M77 700 V150"/><text x="55" y="425" transform="rotate(-90 55 425)" text-anchor="middle">25</text><circle cx="120" cy="700" r="4" fill="#b0473f"/><text x="128" y="692">0;0</text><text x="35" y="790">Торець: 20 мм. </text><text x="35" y="825">Номінальна геометрія, не випуск у виробництво.</text><text x="35" y="866">Вирізи й координати отворів — у таблиці цього аркуша в альбомі.</text><text x="35" y="901">Крайка та технологічні допуски не включені. Присадку фурнітури узгодити перед порізкою.</text><text x="35" y="945">ФОТОБУДКА · СЛАВУТИЧ · РЕВІЗІЯ 06 · 15.09.2026</text></svg>