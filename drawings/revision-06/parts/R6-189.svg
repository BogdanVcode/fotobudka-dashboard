<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000"><style>text{font:17px Arial;fill:#17212b}.title{font:bold 23px Arial}.dim{stroke:#456575;stroke-width:1;fill:none}.part{fill:#f5f7fa;stroke:#17212b;stroke-width:2}.hole{fill:white;stroke:#b0473f;stroke-width:2}</style><rect width="1200" height="1000" fill="white"/><text x="35" y="40" class="title">R6-189 · Верхня перемичка пари рейок оптичної касети V-Slot 20×20</text><text x="35" y="75">150 × 20 × 20 мм · площина Y / Z · усі розміри в мм</text><text x="35" y="103">Початок деталі X / Y / Z = 1326 / 425 / 1750</text><rect class="part" x="120" y="593.33" width="800" height="106.67"/><path class="dim" d="M120 710 V750 M920 710 V750 M120 738 H920"/><text x="520" y="735" text-anchor="middle">150</text><path class="dim" d="M105 700 H65 M105 593.33 H65 M77 700 V593.33"/><text x="55" y="646.67" transform="rotate(-90 55 646.67)" text-anchor="middle">20</text><circle cx="120" cy="700" r="4" fill="#b0473f"/><text x="128" y="692">0;0</text><text x="35" y="790">Торець: 20 мм. Порожниста труба 20×20×2; довжина 150 мм.</text><text x="35" y="825">Номінальна геометрія, не випуск у виробництво.</text><text x="35" y="866">Вирізи й координати отворів — у таблиці цього аркуша в альбомі.</text><text x="35" y="901">Крайка та технологічні допуски не включені. Присадку фурнітури узгодити перед порізкою.</text><text x="35" y="945">ФОТОБУДКА · СЛАВУТИЧ · РЕВІЗІЯ 06 · 15.09.2026</text></svg>