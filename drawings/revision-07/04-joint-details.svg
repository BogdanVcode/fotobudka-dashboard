<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700"><style>
text{font-family:Arial,sans-serif;fill:#17212b}.title{font-size:28px;font-weight:700}.sub{font-size:15px}.viewTitle{font-size:18px;font-weight:700}.envelope{fill:#fbfcfd;stroke:#26343d;stroke-width:1.5}.rail{fill:#d9ecf7;stroke:#145d88;stroke-width:2}.wall{fill:#f3f1ea;fill-opacity:.65;stroke:#8a682d;stroke-width:1.3}.door{fill:#f6e2c4;fill-opacity:.7;stroke:#a35a12;stroke-width:1.8}.bench{fill:#e4d9c4;stroke:#8a682d;stroke-width:1.3}.curtain{fill:#dcd6c8;stroke:#6b6559;stroke-width:1.2}.slope{fill:#dff0df;stroke:#39794b;stroke-width:2}.equipment{fill:#efb875;fill-opacity:.45;stroke:#9c5918;stroke-width:1.4}.mark{font-size:10px;font-weight:700}.dim{stroke:#3d5968;stroke-width:1;fill:none}.guide{stroke:#83949d;stroke-width:1;stroke-dasharray:4 4}.dimText{font-size:13px}.note{font-size:14px}.callout{fill:white;stroke:#657984}.joint{fill:#d9ecf7;stroke:#145d88;stroke-width:3}.bracket{fill:#d1a52c;stroke:#71570c;stroke-width:2}
</style><rect width="1600" height="700" fill="white"/><text class="title" x="28" y="38">Кутники, болти й гайки каркаса кабінки</text><text class="sub" x="28" y="64">Один тип профілю (V-Slot 20×20) і один тип кутового вузла (K1) на всю кабінку; K6 — тільки для сервісних дверцят.</text><rect class="callout" x="40" y="90" width="720" height="420" rx="8"/><text class="viewTitle" x="64" y="124">K1 · звичайний вузол: комплект 2028</text><rect class="joint" x="110" y="190" width="360" height="40"/><rect class="joint" x="430" y="150" width="40" height="220"/><path class="bracket" d="M402 230H430V258H402Z"/><circle cx="414" cy="244" r="5" fill="#52626b"/><circle cx="444" cy="244" r="5" fill="#52626b"/><text class="note" x="110" y="410">1 кутник 20×28 + 2 болти M5×12 + 2 T-гайки.</text><text class="note" x="110" y="438">44 робочих вузлів + запас = 50 комплектів.</text><text class="note" x="110" y="466">Стійки, поперечки, похилі опори консолі й розсіювача.</text><rect class="callout" x="830" y="90" width="720" height="420" rx="8"/><text class="viewTitle" x="854" y="124">K6 · петля сервісних дверцят</text><rect class="joint" x="900" y="150" width="30" height="230"/><rect class="door" x="940" y="150" width="220" height="230"/><circle cx="915" cy="200" r="9" fill="#71570c"/><circle cx="915" cy="265" r="9" fill="#71570c"/><circle cx="915" cy="330" r="9" fill="#71570c"/><text class="note" x="900" y="410">Петля для V-Slot + 4 болти + 4 гайки, вертикальна вісь.</text><text class="note" x="900" y="438">3 петлі на дверцята 594×1220 мм = 3 комплекти K6.</text><text class="note" x="900" y="466">Замок і ручка — окрема закупівля (B04, поза Profile Center).</text></svg>