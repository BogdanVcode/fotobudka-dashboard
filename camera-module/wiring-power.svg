<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 780" width="1560" height="780" role="img"><title>Вертикальний модуль камери — схема P2</title><rect width="100%" height="100%" fill="#f0f5f9"/><g font-family="Segoe UI,Arial,sans-serif"><text x="30" y="42" font-size="29" fill="#193047">01 · Живлення: розетка → двигун і датчики</text><text x="30" y="76" font-size="19" fill="#52677c">Позначення клем — за написами на деталях. Розташування на малюнку умовне.</text><rect x="40" y="105" width="390" height="205" rx="14" fill="white" stroke="#b5c8d7" stroke-width="2"/><text x="58" y="139" font-size="23" fill="#193047">Розетка 230 В</text><text x="58" y="167" font-size="17" fill="#566c80">Готовий шнур із вилкою та землею</text><rect x="1090" y="105" width="430" height="205" rx="14" fill="white" stroke="#b5c8d7" stroke-width="2"/><text x="1108" y="139" font-size="23" fill="#193047">S-250-36</text><text x="1108" y="167" font-size="17" fill="#566c80">Блок живлення 36 В / 250 Вт</text><text x="65" y="196" font-size="20" fill="#193047">Фаза L</text><text x="1115" y="196" font-size="20" fill="#193047">L</text><path d="M430,190 L1090,190" fill="none" stroke="#995124" stroke-width="3.5" /><circle cx="430" cy="190" r="4" fill="#995124"/><circle cx="1090" cy="190" r="4" fill="#995124"/><text x="760" y="181" text-anchor="middle" font-size="17" fill="#995124">L · коричневий</text><text x="65" y="241" font-size="20" fill="#193047">Нуль N</text><text x="1115" y="241" font-size="20" fill="#193047">N</text><path d="M430,235 L1090,235" fill="none" stroke="#126dcc" stroke-width="3.5" /><circle cx="430" cy="235" r="4" fill="#126dcc"/><circle cx="1090" cy="235" r="4" fill="#126dcc"/><text x="760" y="226" text-anchor="middle" font-size="17" fill="#126dcc">N · синій</text><text x="65" y="286" font-size="20" fill="#193047">Захисна земля PE</text><text x="1115" y="286" font-size="20" fill="#193047">⏚ / PE</text><path d="M430,280 L1090,280" fill="none" stroke="#14815a" stroke-width="3.5" /><circle cx="430" cy="280" r="4" fill="#14815a"/><circle cx="1090" cy="280" r="4" fill="#14815a"/><text x="760" y="271" text-anchor="middle" font-size="17" fill="#14815a">PE · жовто-зелений</text><text x="50" y="345" font-size="19" fill="#b85b00">Шнур має бути зафіксований; мережеві клеми закриті. Підготовку 230 В замовити продавцю.</text><rect x="40" y="380" width="390" height="250" rx="14" fill="white" stroke="#b5c8d7" stroke-width="2"/><text x="58" y="414" font-size="23" fill="#193047">S-250-36 · дві гілки</text><rect x="1090" y="380" width="430" height="120" rx="14" fill="white" stroke="#b5c8d7" stroke-width="2"/><text x="1108" y="414" font-size="23" fill="#193047">DM556 · силове живлення</text><rect x="1090" y="520" width="430" height="110" rx="14" fill="white" stroke="#b5c8d7" stroke-width="2"/><text x="1108" y="554" font-size="23" fill="#193047">XL7015 · вхід перетворювача</text><text x="65" y="456" font-size="20" fill="#193047">V+ 36 В</text><text x="1115" y="456" font-size="20" fill="#193047">+VDC</text><path d="M430,450 L1090,450" fill="none" stroke="#c63236" stroke-width="3.5" /><circle cx="430" cy="450" r="4" fill="#c63236"/><circle cx="1090" cy="450" r="4" fill="#c63236"/><text x="760" y="441" text-anchor="middle" font-size="17" fill="#c63236">F1 → +36 В</text><text x="65" y="491" font-size="20" fill="#193047">V−</text><text x="1115" y="491" font-size="20" fill="#193047">GND силовий</text><path d="M430,485 L1090,485" fill="none" stroke="#384558" stroke-width="3.5" /><circle cx="430" cy="485" r="4" fill="#384558"/><circle cx="1090" cy="485" r="4" fill="#384558"/><text x="760" y="476" text-anchor="middle" font-size="17" fill="#384558">0 В двигуна</text><text x="65" y="581" font-size="20" fill="#193047">V+ 36 В</text><text x="1115" y="581" font-size="20" fill="#193047">IN+</text><path d="M430,575 L1090,575" fill="none" stroke="#c63236" stroke-width="3.5" /><circle cx="430" cy="575" r="4" fill="#c63236"/><circle cx="1090" cy="575" r="4" fill="#c63236"/><text x="760" y="566" text-anchor="middle" font-size="17" fill="#c63236">F2 → +36 В</text><text x="65" y="621" font-size="20" fill="#193047">V−</text><text x="1115" y="621" font-size="20" fill="#193047">IN−</text><path d="M430,615 L1090,615" fill="none" stroke="#126dcc" stroke-width="3.5" /><circle cx="430" cy="615" r="4" fill="#126dcc"/><circle cx="1090" cy="615" r="4" fill="#126dcc"/><text x="760" y="606" text-anchor="middle" font-size="17" fill="#126dcc">0 В датчиків / силового кола</text><text x="50" y="674" font-size="18" fill="#193047">F1, F2 — запобіжники гілок: потрібні тримачі та номінали під дроти/навантаження, напруга ≥60 В DC.</text><text x="50" y="710" font-size="20" fill="#b85b00">XL7015: виставити та виміряти 12 В на OUT+ / OUT− ДО підключення датчиків.</text><text x="50" y="746" font-size="20" fill="#c63236">Arduino живиться від USB комп’ютера. 36 В та 12 В до Nano не підключати.</text></g></svg>