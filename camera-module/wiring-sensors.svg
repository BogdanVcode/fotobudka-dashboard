<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1130" width="1560" height="1130" role="img"><title>Вертикальний модуль камери — схема P2</title><rect width="100%" height="100%" fill="#f0f5f9"/><g font-family="Segoe UI,Arial,sans-serif"><text x="30" y="42" font-size="29" fill="#193047">03 · Два датчики: нижня та верхня межі</text><text x="30" y="76" font-size="19" fill="#52677c">Однакове підключення двох HURON LJ12A3-4-Z/BX · NPN NO · живлення 12 В.</text><rect x="40" y="110" width="390" height="285" rx="14" fill="white" stroke="#b5c8d7" stroke-width="2"/><text x="58" y="144" font-size="23" fill="#193047">Датчик №1 · НИЗ / HOME</text><text x="58" y="172" font-size="17" fill="#566c80">Стаціонарний, у кутовому кріпленні</text><rect x="670" y="110" width="410" height="285" rx="14" fill="white" stroke="#b5c8d7" stroke-width="2"/><text x="688" y="144" font-size="23" fill="#193047">Опторозв’язка №1</text><text x="688" y="172" font-size="17" fill="#566c80">Кандидат: PC817 / EL817, вхід 12 В</text><rect x="1240" y="110" width="280" height="285" rx="14" fill="white" stroke="#b5c8d7" stroke-width="2"/><text x="1258" y="144" font-size="23" fill="#193047">Arduino Nano</text><text x="1258" y="172" font-size="17" fill="#566c80">Та сама плата</text><text x="60" y="220" font-size="21" fill="#995124">Коричневий → +12 В</text><text x="60" y="265" font-size="21" fill="#126dcc">Синій → OUT− (0 В)</text><text x="690" y="220" font-size="21" fill="#995124">ВХІД + ← +12 В</text><text x="60" y="315" font-size="21" fill="#193047">Чорний · сигнал</text><text x="690" y="315" font-size="21" fill="#193047">ВХІД −</text><path d="M430,310 L670,310" fill="none" stroke="#384558" stroke-width="3.5" /><circle cx="430" cy="310" r="4" fill="#384558"/><circle cx="670" cy="310" r="4" fill="#384558"/><text x="550" y="301" text-anchor="middle" font-size="17" fill="#384558">NPN</text><text x="690" y="355" font-size="20" fill="#193047">ВИХІД →</text><text x="1260" y="355" font-size="16" fill="#193047">D4 · INPUT_PULLUP</text><path d="M1080,350 L1240,350" fill="none" stroke="#b85b00" stroke-width="3.5" stroke-dasharray="9 6"/><circle cx="1080" cy="350" r="4" fill="#b85b00"/><circle cx="1240" cy="350" r="4" fill="#b85b00"/><text x="1160" y="341" text-anchor="middle" font-size="17" fill="#b85b00">D4</text><text x="690" y="385" font-size="19" fill="#193047">GND виходу →</text><text x="1260" y="385" font-size="19" fill="#193047">GND Nano</text><path d="M1080,380 L1240,380" fill="none" stroke="#384558" stroke-width="3.5" stroke-dasharray="9 6"/><circle cx="1080" cy="380" r="4" fill="#384558"/><circle cx="1240" cy="380" r="4" fill="#384558"/><text x="50" y="435" font-size="18" fill="#193047">Коли датчик бачить сталевий прапорець, чорний дріт замикається на 0 В; опто передає сигнал на D4.</text><rect x="40" y="480" width="390" height="285" rx="14" fill="white" stroke="#b5c8d7" stroke-width="2"/><text x="58" y="514" font-size="23" fill="#193047">Датчик №2 · ВЕРХ</text><text x="58" y="542" font-size="17" fill="#566c80">Стаціонарний, у кутовому кріпленні</text><rect x="670" y="480" width="410" height="285" rx="14" fill="white" stroke="#b5c8d7" stroke-width="2"/><text x="688" y="514" font-size="23" fill="#193047">Опторозв’язка №2</text><text x="688" y="542" font-size="17" fill="#566c80">Кандидат: PC817 / EL817, вхід 12 В</text><rect x="1240" y="480" width="280" height="285" rx="14" fill="white" stroke="#b5c8d7" stroke-width="2"/><text x="1258" y="514" font-size="23" fill="#193047">Arduino Nano</text><text x="1258" y="542" font-size="17" fill="#566c80">Та сама плата</text><text x="60" y="590" font-size="21" fill="#995124">Коричневий → +12 В</text><text x="60" y="635" font-size="21" fill="#126dcc">Синій → OUT− (0 В)</text><text x="690" y="590" font-size="21" fill="#995124">ВХІД + ← +12 В</text><text x="60" y="685" font-size="21" fill="#193047">Чорний · сигнал</text><text x="690" y="685" font-size="21" fill="#193047">ВХІД −</text><path d="M430,680 L670,680" fill="none" stroke="#384558" stroke-width="3.5" /><circle cx="430" cy="680" r="4" fill="#384558"/><circle cx="670" cy="680" r="4" fill="#384558"/><text x="550" y="671" text-anchor="middle" font-size="17" fill="#384558">NPN</text><text x="690" y="725" font-size="20" fill="#193047">ВИХІД →</text><text x="1260" y="725" font-size="16" fill="#193047">D5 · INPUT_PULLUP</text><path d="M1080,720 L1240,720" fill="none" stroke="#8051c9" stroke-width="3.5" stroke-dasharray="9 6"/><circle cx="1080" cy="720" r="4" fill="#8051c9"/><circle cx="1240" cy="720" r="4" fill="#8051c9"/><text x="1160" y="711" text-anchor="middle" font-size="17" fill="#8051c9">D5</text><text x="690" y="755" font-size="19" fill="#193047">GND виходу →</text><text x="1260" y="755" font-size="19" fill="#193047">GND Nano</text><path d="M1080,750 L1240,750" fill="none" stroke="#384558" stroke-width="3.5" stroke-dasharray="9 6"/><circle cx="1080" cy="750" r="4" fill="#384558"/><circle cx="1240" cy="750" r="4" fill="#384558"/><text x="50" y="805" font-size="18" fill="#193047">Коли датчик бачить сталевий прапорець, чорний дріт замикається на 0 В; опто передає сигнал на D5.</text><text x="50" y="882" font-size="20" fill="#193047">+12 В та 0 В для ОБОХ датчиків беремо з OUT+ / OUT− одного XL7015 (розділ 01).</text><text x="50" y="920" font-size="18" fill="#b85b00">Пунктир — потрібна плата з виходом «відкритий колектор»: колектор → D4/D5, емітер → GND Nano.</text><text x="50" y="953" font-size="18" fill="#b85b00">Якщо вихідна сторона плати має VCC — подавати 5 В Nano лише після перевірки її схеми й маркування.</text><text x="50" y="986" font-size="18" fill="#b85b00">Це функціональна схема опто, НЕ порядок клем конкретної товарної плати. Її розводку ще не підтверджено.</text><text x="50" y="1023" font-size="21" fill="#c63236">0 В датчиків НЕ з’єднуємо з GND Arduino: між ними — оптична розв’язка.</text><text x="50" y="1060" font-size="18" fill="#193047">Датчики показують лише межі. Висоту між ними Arduino розраховує за кроками після пошуку HOME.</text><text x="50" y="1094" font-size="18" fill="#193047">NPN NO не виявляє обрив як спрацювання. У програмі потрібні тайм-аут пошуку й обмеження руху.</text></g></svg>