<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 930" width="1560" height="930" role="img"><title>Вертикальний модуль камери — схема P2</title><rect width="100%" height="100%" fill="#f0f5f9"/><g font-family="Segoe UI,Arial,sans-serif"><text x="30" y="42" font-size="29" fill="#193047">04 · Камера та спалах</text><text x="30" y="76" font-size="19" fill="#52677c">На каретці: Canon R50 вертикально, кріплення камери та рухомі кінці трьох кабелів.</text><rect x="40" y="110" width="390" height="350" rx="14" fill="white" stroke="#b5c8d7" stroke-width="2"/><text x="58" y="144" font-size="23" fill="#193047">Нерухомі пристрої</text><rect x="1090" y="110" width="430" height="350" rx="14" fill="white" stroke="#b5c8d7" stroke-width="2"/><text x="1108" y="144" font-size="23" fill="#193047">Canon EOS R50 · на каретці</text><text x="1108" y="172" font-size="17" fill="#566c80">Портретне положення: поворот на 90°</text><text x="65" y="226" font-size="20" fill="#193047">ПК · USB</text><text x="1115" y="226" font-size="20" fill="#193047">USB-C камери</text><path d="M430,220 L1090,220" fill="none" stroke="#167c87" stroke-width="3.5" /><circle cx="430" cy="220" r="4" fill="#167c87"/><circle cx="1090" cy="220" r="4" fill="#167c87"/><text x="760" y="211" text-anchor="middle" font-size="17" fill="#167c87">① USB · дані</text><text x="65" y="316" font-size="20" fill="#193047">Tectra ACK-E18 → LP-E17</text><text x="1115" y="316" font-size="20" fill="#193047">Муляж АКБ у камері</text><path d="M430,310 L1090,310" fill="none" stroke="#c63236" stroke-width="3.5" /><circle cx="430" cy="310" r="4" fill="#c63236"/><circle cx="1090" cy="310" r="4" fill="#c63236"/><text x="760" y="301" text-anchor="middle" font-size="17" fill="#c63236">② Низьковольтне живлення</text><text x="65" y="406" font-size="20" fill="#193047">Godox MS200V · SYNC 3,5</text><text x="1115" y="406" font-size="20" fill="#193047">AD-E1 + Pixel TF-325*</text><path d="M430,400 L1090,400" fill="none" stroke="#b85b00" stroke-width="3.5" stroke-dasharray="9 6"/><circle cx="430" cy="400" r="4" fill="#b85b00"/><circle cx="1090" cy="400" r="4" fill="#b85b00"/><text x="760" y="391" text-anchor="middle" font-size="17" fill="#b85b00">③ Синхрокабель PC ↔ 3,5 мм</text><text x="50" y="515" font-size="18" fill="#b85b00">* AD-E1 і TF-325 куплені, але сумісність цього ланцюжка ще не підтверджена. Не позначено як готовий.</text><rect x="40" y="555" width="1480" height="150" rx="14" fill="white" stroke="#b5c8d7" stroke-width="2"/><text x="58" y="589" font-size="23" fill="#193047">Окреме живлення від розетки 230 В</text><text x="58" y="617" font-size="17" fill="#566c80">ПК через власний блок живлення • Tectra через комплектний адаптер • Godox через власний мережевий шнур</text><text x="60" y="665" font-size="20" fill="#193047">Спалах спрацьовує від камери. ПК через USB керує зйомкою, але не замінює синхроконтакт.</text><rect x="40" y="740" width="1480" height="155" rx="14" fill="white" stroke="#b5c8d7" stroke-width="2"/><text x="58" y="774" font-size="23" fill="#193047">Кабелеукладач 25×38 мм · 1 м + два кінцеві кріплення</text><text x="58" y="802" font-size="17" fill="#566c80">Всередині: ① USB камери   ② низьковольтний кабель живлення   ③ синхрокабель</text><text x="60" y="850" font-size="19" fill="#193047">Мережеві 230 В у рухомий ланцюг не ведемо. Перевірити запас довжини й радіус вигину на всьому ході.</text></g></svg>