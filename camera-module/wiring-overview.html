<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Загальна схема вертикального блоку</title><style>*{box-sizing:border-box}body{margin:0;background:#eef4f8;color:#17354d;font:16px Segoe UI,Arial}header{padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:21px;margin:0 auto 0 0}a,button{background:white;color:#164c75;border:1px solid #b6cad8;border-radius:8px;padding:8px 13px;text-decoration:none;font:inherit;cursor:pointer}#frame{height:calc(100dvh - 100px);overflow:auto;border-top:1px solid #b6cad8}#sheet{display:block;margin:auto;max-width:none}p{margin:0;padding:8px 20px;font-size:14px} @media print{header,p{display:none}#frame{height:auto;overflow:visible}#sheet{width:100%!important;height:auto!important}}</style><header><h1>Усі деталі й підключення — разом</h1><button id="fit">Уся схема</button><button id="plus">＋ Збільшити</button><button id="minus">− Зменшити</button><a href="wiring-overview.svg" download>SVG</a><a href="pin-wiring.html">Контакти докладно</a></header><div id="frame"><img id="sheet" src="wiring-overview.svg" alt="Загальна схема всіх деталей вертикального модуля камери"></div><p>Натисніть «Збільшити», щоб прочитати контакти. Кольорові лінії — дроти; сірий пунктир — механічне кріплення.</p><script>const sheet=document.querySelector('#sheet'),frame=document.querySelector('#frame');let scale=1;function apply(){sheet.style.width=2360*scale+'px';sheet.style.height=1540*scale+'px'}function fit(){scale=Math.min(frame.clientWidth/2360,frame.clientHeight/1540);apply()}document.querySelector('#fit').onclick=fit;document.querySelector('#plus').onclick=()=>{scale=Math.min(2.5,scale*1.3);apply()};document.querySelector('#minus').onclick=()=>{scale=Math.max(.15,scale/1.3);apply()};window.addEventListener('resize',fit);fit();</script></html>
