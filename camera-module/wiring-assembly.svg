<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1010" width="1560" height="1010" role="img"><title>Вертикальний модуль камери — схема P2</title><rect width="100%" height="100%" fill="#f0f5f9"/><g font-family="Segoe UI,Arial,sans-serif"><text x="30" y="42" font-size="29" fill="#193047">05 · Як це розташовано на вертикальному модулі</text><text x="30" y="76" font-size="19" fill="#52677c">Пунктирні з’єднання тут — МЕХАНІКА, не електричні дроти.</text><rect x="55" y="115" width="470" height="110" rx="14" fill="white" stroke="#b5c8d7" stroke-width="2"/><text x="73" y="149" font-size="23" fill="#193047">57BYG250C-8 + LJZ8-DS45-57</text><text x="73" y="177" font-size="17" fill="#566c80">Двигун і кронштейн нерухомі</text><rect x="55" y="265" width="470" height="90" rx="14" fill="white" stroke="#b5c8d7" stroke-width="2"/><text x="73" y="299" font-size="23" fill="#193047">Муфта 8×12 · D25 · L30</text><path d="M290,225 L290,265" fill="none" stroke="#384558" stroke-width="3.5" stroke-dasharray="9 6"/><circle cx="290" cy="225" r="4" fill="#384558"/><circle cx="290" cy="265" r="4" fill="#384558"/><rect x="55" y="400" width="470" height="290" rx="14" fill="white" stroke="#b5c8d7" stroke-width="2"/><text x="73" y="434" font-size="23" fill="#193047">TBD45-700 · ремінний модуль</text><text x="73" y="462" font-size="17" fill="#566c80">Корпус закріплюється вертикально</text><path d="M290,355 L290,400" fill="none" stroke="#384558" stroke-width="3.5" stroke-dasharray="9 6"/><circle cx="290" cy="355" r="4" fill="#384558"/><circle cx="290" cy="400" r="4" fill="#384558"/><rect x="640" y="130" width="840" height="105" rx="14" fill="white" stroke="#b5c8d7" stroke-width="2"/><text x="658" y="164" font-size="23" fill="#193047">Верхній датчик + кутовий кронштейн M12</text><text x="658" y="192" font-size="17" fill="#566c80">Нерухомо на профілі. Окремий сигнальний кабель до електроніки.</text><rect x="640" y="300" width="840" height="170" rx="14" fill="white" stroke="#b5c8d7" stroke-width="2"/><text x="658" y="334" font-size="23" fill="#193047">Каретка → кріплення камери → Canon R50</text><text x="658" y="362" font-size="17" fill="#566c80">На каретці також сталевий прапорець для спрацювання датчиків.</text><text x="660" y="425" font-size="18" fill="#b85b00">Кронштейн камери та прапорець: точні деталі й отвори ще потрібно узгодити.</text><path d="M525,475 L640,385" fill="none" stroke="#384558" stroke-width="3.5" stroke-dasharray="9 6"/><circle cx="525" cy="475" r="4" fill="#384558"/><circle cx="640" cy="385" r="4" fill="#384558"/><rect x="640" y="540" width="840" height="105" rx="14" fill="white" stroke="#b5c8d7" stroke-width="2"/><text x="658" y="574" font-size="23" fill="#193047">Нижній датчик HOME + кутовий кронштейн M12</text><text x="658" y="602" font-size="17" fill="#566c80">Нерухомо. Датчик має спрацювати ДО механічного упора.</text><rect x="55" y="750" width="1425" height="135" rx="14" fill="white" stroke="#b5c8d7" stroke-width="2"/><text x="73" y="784" font-size="23" fill="#193047">У нижньому нерухомому відсіку</text><text x="73" y="812" font-size="17" fill="#566c80">S-250-36 • DM556 • Nano • ULN2003 • XL7015 • 2 опторозв’язки • клеми • запобіжники</text><text x="75" y="850" font-size="18" fill="#193047">Кабелеукладач: один кінець до рами, другий — до каретки. Проводи двигуна не їздять разом із камерою.</text><text x="55" y="935" font-size="19" fill="#b85b00">Відкриті питання: кріплення камери, контактні колодки опто та утримання каретки без живлення.</text><text x="55" y="970" font-size="18" fill="#193047">Два датчики не утримують камеру від падіння. Поведінку ремінного модуля має підтвердити постачальник.</text></g></svg>