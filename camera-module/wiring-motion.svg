<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1120" width="1560" height="1120" role="img"><title>Вертикальний модуль камери — схема P2</title><rect width="100%" height="100%" fill="#f0f5f9"/><g font-family="Segoe UI,Arial,sans-serif"><text x="30" y="42" font-size="29" fill="#193047">02 · Arduino → драйвер → двигун</text><text x="30" y="76" font-size="19" fill="#52677c">ПК передає команди через USB. Arduino формує імпульси руху.</text><rect x="40" y="105" width="390" height="90" rx="14" fill="white" stroke="#b5c8d7" stroke-width="2"/><text x="58" y="139" font-size="23" fill="#193047">Комп’ютер · USB</text><rect x="1090" y="105" width="430" height="90" rx="14" fill="white" stroke="#b5c8d7" stroke-width="2"/><text x="1108" y="139" font-size="23" fill="#193047">Arduino Nano · Mini-USB</text><text x="65" y="179" font-size="20" fill="#193047">USB-A</text><text x="1115" y="179" font-size="20" fill="#193047">Mini-USB</text><path d="M430,173 L1090,173" fill="none" stroke="#167c87" stroke-width="3.5" /><circle cx="430" cy="173" r="4" fill="#167c87"/><circle cx="1090" cy="173" r="4" fill="#167c87"/><text x="760" y="164" text-anchor="middle" font-size="17" fill="#167c87">Дані + живлення 5 В</text><rect x="40" y="220" width="390" height="235" rx="14" fill="white" stroke="#b5c8d7" stroke-width="2"/><text x="58" y="254" font-size="23" fill="#193047">Arduino Nano</text><text x="58" y="282" font-size="17" fill="#566c80">Класична ATmega328P, 5 В</text><rect x="1090" y="220" width="430" height="235" rx="14" fill="white" stroke="#b5c8d7" stroke-width="2"/><text x="1108" y="254" font-size="23" fill="#193047">ULN2003 · буфер сигналів</text><text x="1108" y="282" font-size="17" fill="#566c80">Перевірити контакти фактичної плати</text><text x="65" y="316" font-size="20" fill="#193047">D2 · кроки</text><text x="1115" y="316" font-size="20" fill="#193047">IN1</text><path d="M430,310 L1090,310" fill="none" stroke="#14815a" stroke-width="3.5" /><circle cx="430" cy="310" r="4" fill="#14815a"/><circle cx="1090" cy="310" r="4" fill="#14815a"/><text x="760" y="301" text-anchor="middle" font-size="17" fill="#14815a">STEP</text><text x="65" y="356" font-size="20" fill="#193047">D3 · напрямок</text><text x="1115" y="356" font-size="20" fill="#193047">IN2</text><path d="M430,350 L1090,350" fill="none" stroke="#8051c9" stroke-width="3.5" /><circle cx="430" cy="350" r="4" fill="#8051c9"/><circle cx="1090" cy="350" r="4" fill="#8051c9"/><text x="760" y="341" text-anchor="middle" font-size="17" fill="#8051c9">DIR</text><text x="65" y="396" font-size="20" fill="#193047">5V</text><text x="1115" y="396" font-size="20" fill="#193047">V+ плати / COM</text><path d="M430,390 L1090,390" fill="none" stroke="#c63236" stroke-width="3.5" /><circle cx="430" cy="390" r="4" fill="#c63236"/><circle cx="1090" cy="390" r="4" fill="#c63236"/><text x="760" y="381" text-anchor="middle" font-size="17" fill="#c63236">+5 В</text><text x="65" y="436" font-size="20" fill="#193047">GND</text><text x="1115" y="436" font-size="20" fill="#193047">GND плати</text><path d="M430,430 L1090,430" fill="none" stroke="#384558" stroke-width="3.5" /><circle cx="430" cy="430" r="4" fill="#384558"/><circle cx="1090" cy="430" r="4" fill="#384558"/><text x="760" y="421" text-anchor="middle" font-size="17" fill="#384558">Логічний GND</text><rect x="40" y="490" width="390" height="245" rx="14" fill="white" stroke="#b5c8d7" stroke-width="2"/><text x="58" y="524" font-size="23" fill="#193047">ULN2003 + шина 5 В</text><text x="58" y="552" font-size="17" fill="#566c80">Не вгадувати контакти роз’єму X2</text><rect x="1090" y="490" width="430" height="245" rx="14" fill="white" stroke="#b5c8d7" stroke-width="2"/><text x="1108" y="524" font-size="23" fill="#193047">DM556 · сигнальні клеми</text><text x="1108" y="552" font-size="17" fill="#566c80">ENA+ / ENA− поки не підключені</text><text x="65" y="581" font-size="20" fill="#193047">OUT1 (1C)</text><text x="1115" y="581" font-size="20" fill="#193047">PUL−</text><path d="M430,575 L1090,575" fill="none" stroke="#14815a" stroke-width="3.5" /><circle cx="430" cy="575" r="4" fill="#14815a"/><circle cx="1090" cy="575" r="4" fill="#14815a"/><text x="760" y="566" text-anchor="middle" font-size="17" fill="#14815a">STEP після буфера</text><text x="65" y="621" font-size="20" fill="#193047">OUT2 (2C)</text><text x="1115" y="621" font-size="20" fill="#193047">DIR−</text><path d="M430,615 L1090,615" fill="none" stroke="#8051c9" stroke-width="3.5" /><circle cx="430" cy="615" r="4" fill="#8051c9"/><circle cx="1090" cy="615" r="4" fill="#8051c9"/><text x="760" y="606" text-anchor="middle" font-size="17" fill="#8051c9">DIR після буфера</text><text x="65" y="661" font-size="20" fill="#193047">5 В від Nano</text><text x="1115" y="661" font-size="20" fill="#193047">PUL+</text><path d="M430,655 L1090,655" fill="none" stroke="#c63236" stroke-width="3.5" /><circle cx="430" cy="655" r="4" fill="#c63236"/><circle cx="1090" cy="655" r="4" fill="#c63236"/><text x="760" y="646" text-anchor="middle" font-size="17" fill="#c63236">+5 В</text><text x="65" y="701" font-size="20" fill="#193047">Ті самі 5 В</text><text x="1115" y="701" font-size="20" fill="#193047">DIR+</text><path d="M430,695 L1090,695" fill="none" stroke="#c63236" stroke-width="3.5" /><circle cx="430" cy="695" r="4" fill="#c63236"/><circle cx="1090" cy="695" r="4" fill="#c63236"/><text x="760" y="686" text-anchor="middle" font-size="17" fill="#c63236">+5 В</text><rect x="40" y="765" width="390" height="245" rx="14" fill="white" stroke="#b5c8d7" stroke-width="2"/><text x="58" y="799" font-size="23" fill="#193047">DM556 · вихід двигуна</text><rect x="1090" y="765" width="430" height="245" rx="14" fill="white" stroke="#b5c8d7" stroke-width="2"/><text x="1108" y="799" font-size="23" fill="#193047">57BYG250C-8</text><text x="1108" y="827" font-size="17" fill="#566c80">Дві обмотки, чотири жили</text><text x="65" y="856" font-size="20" fill="#193047">A+</text><text x="1115" y="856" font-size="20" fill="#193047">Обмотка A · кінець 1</text><path d="M430,850 L1090,850" fill="none" stroke="#14815a" stroke-width="3.5" /><circle cx="430" cy="850" r="4" fill="#14815a"/><circle cx="1090" cy="850" r="4" fill="#14815a"/><text x="760" y="841" text-anchor="middle" font-size="17" fill="#14815a">M1</text><text x="65" y="896" font-size="20" fill="#193047">A−</text><text x="1115" y="896" font-size="20" fill="#193047">Обмотка A · кінець 2</text><path d="M430,890 L1090,890" fill="none" stroke="#14815a" stroke-width="3.5" /><circle cx="430" cy="890" r="4" fill="#14815a"/><circle cx="1090" cy="890" r="4" fill="#14815a"/><text x="760" y="881" text-anchor="middle" font-size="17" fill="#14815a">M2</text><text x="65" y="936" font-size="20" fill="#193047">B+</text><text x="1115" y="936" font-size="20" fill="#193047">Обмотка B · кінець 1</text><path d="M430,930 L1090,930" fill="none" stroke="#8051c9" stroke-width="3.5" /><circle cx="430" cy="930" r="4" fill="#8051c9"/><circle cx="1090" cy="930" r="4" fill="#8051c9"/><text x="760" y="921" text-anchor="middle" font-size="17" fill="#8051c9">M3</text><text x="65" y="976" font-size="20" fill="#193047">B−</text><text x="1115" y="976" font-size="20" fill="#193047">Обмотка B · кінець 2</text><path d="M430,970 L1090,970" fill="none" stroke="#8051c9" stroke-width="3.5" /><circle cx="430" cy="970" r="4" fill="#8051c9"/><circle cx="1090" cy="970" r="4" fill="#8051c9"/><text x="760" y="961" text-anchor="middle" font-size="17" fill="#8051c9">M4</text><text x="50" y="1050" font-size="19" fill="#b85b00">Кольори жил двигуна не задані: пари обмоток визначити за паспортом або мультиметром.</text><text x="50" y="1084" font-size="18" fill="#193047">Струм та мікрокрок DM556 налаштувати за паспортом конкретного драйвера й двигуна; не «на максимум».</text></g></svg>